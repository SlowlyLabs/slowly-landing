
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    
    <linearGradient id="tide-warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5B8"></stop>
      <stop offset="50%" stop-color="#E8C575"></stop>
      <stop offset="100%" stop-color="#A8823A"></stop>
    </linearGradient>
    
